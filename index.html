<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Telefon Kılıf Dükkanım</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header class="hero">
      <div class="container">
        <h1>Telefon Kılıf Dükkanım</h1>
        <p>Kendi tasarım telefon kılıflarını online satmaya başla.</p>
        <a href="#urunler" class="btn">Ürünleri Gör</a>
      </div>
    </header>

    <main class="container">
      <section id="urunler">
        <h2>Öne Çıkan Kılıflar</h2>
        <div id="productGrid" class="grid"></div>
      </section>

      <section class="cart">
        <h2>Sepet</h2>
        <ul id="cartItems"></ul>
        <p class="total">Toplam: <strong id="cartTotal">0 TL</strong></p>
        <button id="checkoutBtn" class="btn">Siparişi Tamamla</button>
      </section>
    </main>

    <footer>
      <div class="container">
        <p>© 2026 Telefon Kılıf Dükkanım</p>
      </div>
    </footer>

    <script src="script.js"></script>
  </body>
</html>
